<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottom Buttons Page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #121212; /* dark background */
            color: white; /* makes text readable */
            text-align: center;
        }

        .top-text {
            margin-top: 20px;
            font-size: 18px;
            max-width: 600px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
        }

        button {
            padding: 12px 32px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 999px;
            background-color: #444;
            color: white;
            border: 2px solid #701bf3;
            box-shadow: 0 0 8px #701bf3, 0 0 16px #701bf3;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #2f2f2f;
            box-shadow: 0 0 12px #701bf3, 0 0 24px #701bf3;
        }
    </style>
</head>
<body>

    <div class="top-text">
        This is currently in the testing phase, These clients are for eaglercraft 1.5.2 not 1.8.8 or 1.12.2, enjoy!
    </div>

    <div class="button-container">
        <button onclick="window.location.href='https://oriemorie.github.io/classicclient'">
            Classic Client (Casual, High FPS)
        </button>

        <button onclick="window.location.href='https://oriemorie.github.io/orieclient'">
            Orie Client (Competitive, PVP)
        </button>
    </div>

</body>
</html>
